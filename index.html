<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Minimal inline styles to prevent flash before CSS loads -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #E0F2FE;
        overscroll-behavior: none;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      /* Pre-splash screen — visible instantly before React mounts */
      #pre-splash {
        position: fixed; inset: 0; z-index: 100000;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: linear-gradient(180deg, var(--pre-blob, #6EE7B7) 0%, var(--pre-bg, #E0F2FE) 30%, var(--pre-bg, #E0F2FE) 100%);
        transition: opacity 0.4s ease;
      }
      #pre-splash.fade-out { opacity: 0; pointer-events: none; }
      #pre-splash .icon-box {
        width: 96px; height: 96px; border-radius: 24px;
        background: linear-gradient(135deg, var(--pre-primary, #10b981), var(--pre-primary-h, #059669));
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        animation: pre-pulse 1.5s ease-in-out infinite;
      }
      #pre-splash .app-name {
        margin-top: 20px; font-size: 36px; font-weight: 900;
        letter-spacing: -0.02em; font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, var(--pre-primary, #10b981), #0f172a);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #pre-splash .tagline {
        margin-top: 4px; font-size: 14px; font-weight: 500;
        color: var(--pre-text, #475569); font-family: system-ui, -apple-system, sans-serif;
      }
      #pre-splash .bar-track {
        margin-top: 24px; width: 176px; height: 6px; border-radius: 3px;
        background: rgba(0,0,0,0.08); overflow: hidden;
      }
      #pre-splash .bar-fill {
        height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, var(--pre-primary, #10b981), #06b6d4);
        animation: pre-bar 3s cubic-bezier(0.4,0,0.2,1) forwards;
      }
      @keyframes pre-pulse {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes pre-bar {
        0%   { width: 0%; }
        20%  { width: 25%; }
        50%  { width: 55%; }
        80%  { width: 80%; }
        100% { width: 100%; }
      }
    </style>
    
    <!-- Prevent theme flicker by applying saved theme before page renders -->
    <script>
      (function() {
        try {
          var themes = {
            'default': { bg:'#E0F2FE', blob:'#6EE7B7', primary:'#10b981', primaryH:'#059669', text:'#475569' },
            'mocha':   { bg:'#F5EDE8', blob:'#D4A574', primary:'#8B6F47', primaryH:'#6B5335', text:'#5D4E37' },
            'ocean':   { bg:'#0F172A', blob:'#0891b2', primary:'#06b6d4', primaryH:'#0891b2', text:'#94a3b8' },
            'aurora':  { bg:'#13111C', blob:'#8b5cf6', primary:'#a78bfa', primaryH:'#7c3aed', text:'#a1a1aa' },
            'amoled':  { bg:'#000000', blob:'#10b981', primary:'#10b981', primaryH:'#059669', text:'#a1a1aa' }
          };
          
          var savedTheme = localStorage.getItem('fitflow-theme') || 'default';
          var t = themes[savedTheme] || themes['default'];
          document.documentElement.setAttribute('data-theme', savedTheme);
          
          // Set background to match theme's page background
          // CRITICAL: iOS PWA uses html/body background for status bar area
          document.documentElement.style.setProperty('background-color', t.bg, 'important');
          document.documentElement.style.setProperty('--theme-bg', t.bg);// Also set CSS variable
          
          // Pre-splash theme vars (available before CSS bundle loads)
          document.documentElement.style.setProperty('--pre-bg', t.bg);
          document.documentElement.style.setProperty('--pre-blob', t.blob);
          document.documentElement.style.setProperty('--pre-primary', t.primary);
          document.documentElement.style.setProperty('--pre-primary-h', t.primaryH);
          document.documentElement.style.setProperty('--pre-text', t.text);
          
          // Body may not exist yet (script in <head>), apply when ready
          if (document.body) {
            document.body.style.setProperty('background-color', t.bg, 'important');
          } else {
            document.addEventListener('DOMContentLoaded', function() {
              document.body.style.setProperty('background-color', t.bg, 'important');
            });
          }
          
          // Update theme-color meta tag immediately for PWA status bar/notch area
          var themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute('content', t.bg);
          }
          
          // Update msapplication-TileColor for Windows
          var tileColorMeta = document.querySelector('meta[name="msapplication-TileColor"]');
          if (tileColorMeta) {
            tileColorMeta.setAttribute('content', t.bg);
          }
          
          if (['ocean', 'aurora', 'amoled'].includes(savedTheme)) {
            document.documentElement.classList.add('dark-theme');
            // Dark theme text for pre-splash app name
            var style = document.createElement('style');
            style.textContent = '#pre-splash .app-name{background:linear-gradient(135deg,' + t.primary + ',#e2e8f0) !important;-webkit-background-clip:text;background-clip:text;}';
            document.head.appendChild(style);
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS Status Bar: black-translucent makes it transparent, background shows through -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Haefit" />
    <meta name="application-name" content="Haefit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Theme color for Android and browser UI (iOS ignores this for status bar) -->
    <meta name="theme-color" content="#E0F2FE" id="theme-color-meta" />
    <meta name="msapplication-TileColor" content="#E0F2FE" id="tile-color-meta" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Haefit - Gym Management System" />
    <meta name="keywords" content="gym, fitness, management, members, payments" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Haefit - Gym Management</title>
    
    <!-- Preload background image for rondesignlab theme (prevents blank flash) -->
    <script>
      (function() {
        try {
          if (localStorage.getItem('fitflow-theme') === 'rondesignlab') {
            var isMobile = window.innerWidth < 768;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.type = 'image/webp';
            link.href = isMobile ? '/src/images/bg-mobile.webp' : '/src/images/bg-desktop.webp';
            document.head.appendChild(link);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body style="background-color:#E0F2FE">
    <!-- Pre-splash: OUTSIDE #root so React.createRoot won't destroy it.
         SplashScreen.tsx fades it out once React has painted. -->
    <div id="pre-splash">
      <div class="icon-box">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="3" height="8" rx="1"/><rect x="18" y="8" width="3" height="8" rx="1"/>
          <rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/>
          <line x1="10" y1="12" x2="14" y2="12"/>
        </svg>
      </div>
      <div class="app-name">Haefit</div>
      <div class="tagline">Gym Management Made Simple</div>
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      // Handle bfcache restore: if browser restores page from cache,
      // the pre-splash was already removed. Force a clean reload so
      // the pre-splash HTML re-renders and React re-initializes properly.
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          window.location.reload();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
